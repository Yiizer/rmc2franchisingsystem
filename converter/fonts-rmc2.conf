<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- RMC2 proposal templates name fonts that Linux does not ship. Map each to the closest installed font so
     LibreOffice keeps the same line breaks as the PC (Arial and "Arial MT" -> Liberation Sans, metric-compatible;
     Cambria -> Caladea and Calibri -> Carlito are metric-compatible and already aliased by their packages).
     Without this, "Arial MT" and Aptos fall back to Noto Sans and text rewraps. -->
<fontconfig>
  <alias binding="same"><family>Arial MT</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Aptos</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Aptos Display</family><prefer><family>Carlito</family></prefer></alias>
  <!-- Wine's Tahoma is metric-compatible; the templates also embed Tahoma, which LibreOffice uses when it can. -->
  <alias binding="same"><family>Tahoma</family><prefer><family>Tahoma</family><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
